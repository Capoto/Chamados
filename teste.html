<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">


<div class="row">
    <div class="col-md-10 offset-md-1">
        <div class="row">
            
            <div class="col-md-6">
                <div class="mb-3">
                    <label class="form-label">Nome Completo / Empresa *</label>
                    <input class="form-control" placeholder="Nome do cliente ou empresa" name="nome" required>
                </div>
            </div>

            <div class="col-md-6">
                <div class="mb-3">
                    <label class="form-label">Email para Contato *</label>
                    <input type="email" class="form-control" placeholder="name@example.com" name="email" required>
                </div>
            </div>

        </div>
    </div>
</div>

<div class="row">
    <div class="col-md-10 offset-md-1">
        <div class="mb-3">
            <label class="form-label texto">Categoria *</label>
            <select class="form-select" name="categoria" required>
                <option selected>Selecione a Categoria do Problema</option>
                <option value="Hardware">Hardware</option>
                <option value="Software">Software</option>
                <option value="Rede">Rede</option>
                <option value="Licitação">Licitação</option>
                <option value="Financeiros">Financeiros</option>
                <option value="Outros">Outros</option>
            </select>
        </div>
    </div>
</div>
