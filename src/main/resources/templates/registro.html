<!DOCTYPE html>
<html>

<head>
    <title>Chamado</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>



<body>

    
    <br><center><div id="mensagem"></div></center>

    <div class="registro container mt-5">
        <form id="registrouser" method="post" class="row g-3">

            <center><strong><h1>Registro</h1></strong></center>

                 <div class="col-md-10 offset-md-1">
                  <div class="mb-3">
                <label class="form-label texto">Nome</label>
                <input  class="form-control" id="nome"
                    placeholder="Ex: João">
                <div class="valid-feedback">
      Nome informado
    </div>
                <div class="invalid-feedback">
      Informe o nome
    </div>
            </div>
                     
                 </div>
           
             <div class="col-md-10 offset-md-1">
                    <div class="mb-3">
                <label class="form-label texto">E-mail</label>
                <input class="form-control" id="email"
                    placeholder="Ex: example@gmail.com">
                <div class="valid-feedback">
      E-mail informado 
    </div>
                <div class="invalid-feedback">
      Informe o e-mail no formato correto
    </div>
            </div>
                 
             </div>
            
             <div class="col-md-10 offset-md-1">
            <div class="mb-3">
                <label class="form-label texto">Nome da Empresa</label>
                <input  class="form-control" id="empresa"
                    placeholder="Ex:  SoluçõesTI">
                <div class="valid-feedback">
      Nome da empresa informado 
    </div>
                <div class="invalid-feedback">
      Informe o nome da empresa
    </div>
            </div>
             </div>
            
            <div class="col-md-10 offset-md-1">
             <div class="mb-3">
                <label class="form-label texto">Endereço</label>
                <input  class="form-control" id="endereco"
                    placeholder="Ex: Rua José Quadra 24">
                 <div class="valid-feedback">
      Nome do Endereço informado
    </div>
                <div class="invalid-feedback">
      Informe o Endereço
    </div>
            </div>
               
             </div>
            
        <div class="col-md-10 offset-md-1">
     <div class="mb-3">       
    <label for="senha" class="form-label">Senha</label>

   
        <input name="senha"
               class="form-control"
               id="senha"
               type="password"
               placeholder="Senha"
               >

        <div class="valid-feedback">
    Senha informada
    </div>
                <div class="invalid-feedback">
      Informe a Senha!
    </div>
    
</div>
             
            
        </div>



            <div class="col-md-10 offset-md-1">
            <div class="mb-3">
                <label class="form-label texto">Confirma Senha</label>
                
                <input class="form-control" id="confirma"
                    placeholder="Senha" type="password">
                <div class="valid-feedback">
      A senha informada é a mesma
    </div>
                <div class="invalid-feedback">
      A senha confirmada não é a mesma!
    </div>
                
            </div>
            </div>
            <br>
            <div class="col-md-10 offset-md-1">
                <div class="mb-3">
                <button type="submit" class="btn btn-dark buttonregistro w-100" >Registrar</button>
            </div>
            </div>
            <center><a class="nav-link" href="/">Entrar</a></center>
        </form>
    </div>
    <br><br>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script> 
     <script  th:src="@{/js/criaruser.js}"></script> 
</body>

</html>
