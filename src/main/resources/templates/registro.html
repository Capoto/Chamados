<body>

    <br><br>
<center><div id="mensagem"></div></center>
    <div class="registro container mt-5">
        <form id="registrouser" method="post" class="row g-3">

            <center><Strong>
                    <h1>Registro<h1><Strong></center>
           
                  <div class="mb-3">
                <label class="form-label texto">Nome</label>
                <input name="titulo" class="form-control completoregistro" id="nome"
                    placeholder="Ex: João" required>
            </div>
           
                    <div class="mb-3">
                <label class="form-label texto">E-mail</label>
                <input name="titulo" class="form-control completoregistro" id="email"
                    placeholder="Ex: example@gmail.com" required>
            </div>
            
             <div class="mb-3">
                <label class="form-label texto">Nome da Empresa</label>
                <input name="titulo" class="form-control completoregistro" id="empresa"
                    placeholder="Ex:  SoluçõesTI" required>
            </div>
            
             <div class="mb-3">
                <label class="form-label texto">Endereço</label>
                <input name="titulo" class="form-control completoregistro" id="endereco"
                    placeholder="Ex: Rua José Quadra 24" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label texto">Senha</label>
                <input name="titulo" class="form-control completoregistro" id="senha" type="password"
                    placeholder="Senha" required>
            </div>
           
            <div class="mb-3">
                <label class="form-label texto">Confirma Senha</label>
                <input name="titulo" class="form-control completoregistro" id="confirma"
                    placeholder="Senha" type="password" required>
            </div>
            <br>
            <div class="text-left">
                <button type="submit" class="btn btn-dark buttonregistro" style="margin-left: 1.5cm;">Registrar</button>
            </div>
        </form>
    </div>
    <br><br>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
