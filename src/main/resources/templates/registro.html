<body>

    <br><br>
<center><div id="mensagem"></div></center>
    <div class="registro container mt-5">
        <form id="registrouser" method="post" class="row g-3">

            <center><strong><h1>Registro</h1></strong></center>

                 <div class="col-md-10 offset-md-1">
                  <div class="mb-3">
                <label class="form-label texto">Nome</label>
                <input  class="form-control" id="nome"
                    placeholder="Ex: João" required>
            </div>
                     
                 </div>
           
             <div class="col-md-10 offset-md-1">
                    <div class="mb-3">
                <label class="form-label texto">E-mail</label>
                <input class="form-control" id="email"
                    placeholder="Ex: example@gmail.com" required>
            </div>
                 
             </div>
            
             <div class="col-md-10 offset-md-1">
            <div class="mb-3">
                <label class="form-label texto">Nome da Empresa</label>
                <input  class="form-control" id="empresa"
                    placeholder="Ex:  SoluçõesTI" required>
            </div>
             </div>
            
            <div class="col-md-10 offset-md-1">
             <div class="mb-3">
                <label class="form-label texto">Endereço</label>
                <input  class="form-control" id="endereco"
                    placeholder="Ex: Rua José Quadra 24" required>
            </div>
             </div>
            
        <div class="col-md-10 offset-md-1">
     <div class="mb-3">       
    <label for="senha" class="form-label">Senha</label>

    <div class="position-relative">
        <input name="senha"
               class="form-control"
               id="senha"
               type="password"
               placeholder="Senha"
               required>

        <i id="toggleSenha"
           class="bi bi-eye position-absolute top-50 end-0 translate-middle-y me-2"
           style="cursor: pointer; font-size: 1.4rem;"></i>
    </div>
</div>
        </div>



            <div class="col-md-10 offset-md-1">
            <div class="mb-3">
                <label class="form-label texto">Confirma Senha</label>
                <div class="position-relative">
                <input class="form-control" id="confirma"
                    placeholder="Senha" type="password" required>
                <i id="toggleSenha"
           class="bi bi-eye position-absolute top-50 end-0 translate-middle-y me-2"
           style="cursor: pointer; font-size: 1.4rem;"></i>
                </div>
            </div>
            </div>
            <br>
            <div class="offset-md-1">
                <button type="submit" class="btn btn-dark buttonregistro" >Registrar</button>
            </div>
        </form>
    </div>
    <br><br>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
