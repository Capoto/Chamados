<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary colornav">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"

            <div class="collapse navbar-collapse" id="navbarNavDropdown">

    <br><br>
    <div class="login container mt-5">
        <form id="login" method="post" class="row g-3">

            <center><Strong><h1>Login</h1></Strong></center>
           
            <div class="col-md-10 offset-md-1">
                    <div class="mb-3">
                <label class="form-label texto">E-mail</label>
                <input  class="form-control" id="email"
                    placeholder="Ex: example@gmail.com" required>
            </div>
            </div>
            
            <div class="col-md-10 offset-md-1">
            <div class="mb-3">
               
                <label class="form-label texto">Senha</label>
                 <div class="position-relative">
                <input class="form-control" id="senha"
                    placeholder="Senha" type="password" required>
                <i id="toggleSenha"
           class="bi bi-eye position-absolute top-50 end-0 translate-middle-y me-2"
           style="cursor: pointer; font-size: 1.4rem;"></i>
                 </div>
            </div>
            </div>
            <br>
            <div class="mb3 offset-md-1">
                <button type="submit" class="btn btn-dark buttonregistro">Entrar</button>
            </div>
        </form>
    </div>
