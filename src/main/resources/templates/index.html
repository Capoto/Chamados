<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>



<body>

    
<br><br><center><div id="mensagem"></div></center><br><br>
    <div class="login container mt-5">
        <form id="login" method="post" class="row g-3">

            <center><Strong><h1>Login</h1></Strong></center>
           
            <div class="col-md-10 offset-md-1">
                    <div class="mb-3">
                <label class="form-label texto">E-mail</label>
                <input  class="form-control" id="email"
                    placeholder="Ex: example@gmail.com" >
                 <div class="valid-feedback">
      E-mail informado!
    </div>
                <div class="invalid-feedback">
      Por favor preencha o e-mail no formato correto
    </div>
            </div>
            </div>
            
            <div class="col-md-10 offset-md-1">
            <div class="mb-3">
               
                <label class="form-label texto">Senha</label>
               
                <input class="form-control" id="senha"
                    placeholder="Senha" type="password">
                
                 
                 <div class="valid-feedback">
      Senha informada!
    </div>
                <div class="invalid-feedback">
      Por favor informe a senha!
    </div>
            </div>
            </div>
            <br>
            <div class="col-md-10 offset-md-1">
                <div class="mb-3">
                <button type="submit" class="btn btn-dark w-100">Entrar</button>
                </div>
                
            </div>
            <center><a class="nav-link" href="registro">Registrar-se</a></center>
        </form>
    </div>
    <br><br>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script> 
     <script  th:src="@{/js/login.js}"></script> 
</body>

</html>
